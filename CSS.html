<style>

/* =========================================================
   PRODUCTS HUB
   CSS.html
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f7fb;
  color: #1f2937;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {
  height: 68px;
  width: 100%;

  background: #ffffff;

  border-bottom: 1px solid #e5e7eb;

  display: flex;
  align-items: center;

  padding: 0 24px;

  position: sticky;
  top: 0;
  z-index: 100;
}


.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}


.brand-icon {
  width: 38px;
  height: 38px;

  border-radius: 9px;

  background: #087f5b;
  color: #ffffff;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 20px;
  font-weight: 700;
}


.brand-title {
  font-size: 19px;
  font-weight: 700;
  line-height: 22px;
}


.brand-subtitle {
  font-size: 11px;
  color: #6b7280;
  margin-top: 2px;
}


/* =========================================================
   MAIN LAYOUT
========================================================= */

.app-layout {
  display: flex;
  min-height: calc(100vh - 68px);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
  width: 235px;
  flex-shrink: 0;

  background: #ffffff;

  border-right: 1px solid #e5e7eb;

  padding: 18px 12px;

  min-height: calc(100vh - 68px);
}


.nav-item {
  width: 100%;

  border: none;
  outline: none;

  background: transparent;

  text-align: left;

  padding: 11px 13px;

  margin-bottom: 3px;

  border-radius: 8px;

  font-size: 14px;

  color: #374151;

  cursor: pointer;

  transition:
    background 0.15s ease,
    color 0.15s ease;
}


.nav-item:hover {
  background: #f3f4f6;
}


.nav-item.active {
  background: #e8f7f1;
  color: #087f5b;
  font-weight: 600;
}


.nav-divider {
  height: 1px;

  background: #eeeeee;

  margin: 17px 8px;
}


.nav-heading {
  font-size: 10px;

  font-weight: 700;

  color: #9ca3af;

  padding: 4px 13px 9px;

  letter-spacing: 0.6px;
}


/* =========================================================
   MAIN CONTENT
========================================================= */

.main-content {
  flex: 1;

  min-width: 0;

  padding: 28px;

  overflow-x: hidden;
}


#app {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
}


/* =========================================================
   PAGE HEADER
========================================================= */

.page-header {
  margin-bottom: 25px;
}


.page-title {
  margin: 0;

  font-size: 28px;

  font-weight: 700;

  line-height: 34px;

  color: #111827;
}


.page-description {
  margin-top: 6px;

  font-size: 14px;

  color: #6b7280;
}


/* =========================================================
   SEARCH
========================================================= */

.search-container {
  position: relative;

  width: 100%;

  max-width: 700px;

  margin-bottom: 25px;
}


.search-box {
  width: 100%;

  height: 46px;

  padding: 0 16px 0 44px;

  border: 1px solid #d1d5db;

  border-radius: 10px;

  background: #ffffff;

  outline: none;

  font-size: 14px;

  color: #111827;

  transition: border-color 0.15s ease,
              box-shadow 0.15s ease;
}


.search-box:focus {
  border-color: #087f5b;

  box-shadow:
    0 0 0 3px rgba(8, 127, 91, 0.10);
}


.search-icon {
  position: absolute;

  left: 16px;
  top: 50%;

  transform: translateY(-50%);

  color: #9ca3af;

  font-size: 17px;

  pointer-events: none;
}


/* =========================================================
   DASHBOARD CARDS
========================================================= */

.dashboard-grid {
  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 16px;
}


.dashboard-card {
  background: #ffffff;

  border: 1px solid #e5e7eb;

  border-radius: 12px;

  padding: 20px;

  cursor: pointer;

  min-height: 145px;

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    border-color 0.15s ease;
}


.dashboard-card:hover {
  transform: translateY(-2px);

  border-color: #d1d5db;

  box-shadow:
    0 7px 20px rgba(0, 0, 0, 0.06);
}


.dashboard-icon {
  width: 42px;
  height: 42px;

  border-radius: 10px;

  background: #f0fdf4;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 21px;

  margin-bottom: 15px;
}


.dashboard-title {
  font-size: 13px;

  color: #6b7280;
}


.dashboard-count {
  margin-top: 4px;

  font-size: 28px;

  line-height: 32px;

  font-weight: 700;

  color: #111827;
}


/* =========================================================
   SECTION
========================================================= */

.section {
  margin-top: 32px;
}


.section-title {
  font-size: 18px;

  font-weight: 700;

  color: #111827;

  margin-bottom: 15px;
}


.section-description {
  font-size: 13px;

  color: #6b7280;

  margin-top: -8px;

  margin-bottom: 15px;
}


/* =========================================================
   QUICK ACCESS
========================================================= */

.quick-grid {
  display: grid;

  grid-template-columns:
    repeat(6, minmax(0, 1fr));

  gap: 10px;
}


.quick-button {
  min-height: 55px;

  padding: 10px 12px;

  border: 1px solid #e5e7eb;

  border-radius: 9px;

  background: #ffffff;

  color: #374151;

  font-size: 13px;

  cursor: pointer;

  transition:
    background 0.15s ease,
    border-color 0.15s ease;
}


.quick-button:hover {
  background: #f9fafb;

  border-color: #cbd5e1;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state {
  background: #ffffff;

  border: 1px solid #e5e7eb;

  border-radius: 12px;

  padding: 45px 25px;

  text-align: center;

  color: #6b7280;
}


.empty-icon {
  font-size: 38px;

  margin-bottom: 12px;
}


.empty-title {
  font-size: 16px;

  font-weight: 600;

  color: #374151;

  margin-bottom: 6px;
}


/* =========================================================
   LOADING
========================================================= */

.loading {
  background: #ffffff;

  border: 1px solid #e5e7eb;

  border-radius: 12px;

  padding: 50px;

  text-align: center;

  color: #6b7280;

  font-size: 14px;
}


/* =========================================================
   ERROR
========================================================= */

.error-box {
  background: #ffffff;

  border: 1px solid #fecaca;

  border-radius: 12px;

  padding: 25px;

  color: #991b1b;
}


.error-title {
  font-weight: 700;

  margin-bottom: 7px;
}


/* =========================================================
   DATA TABLE
========================================================= */

.table-container {
  width: 100%;

  overflow-x: auto;

  background: #ffffff;

  border: 1px solid #e5e7eb;

  border-radius: 12px;
}


.data-table {
  width: 100%;

  border-collapse: collapse;

  font-size: 13px;

  min-width: 700px;
}


.data-table th {
  background: #f8fafc;

  color: #374151;

  font-weight: 600;

  text-align: left;

  padding: 12px;

  border-bottom: 1px solid #e5e7eb;

  white-space: nowrap;
}


.data-table td {
  padding: 12px;

  border-bottom: 1px solid #f1f5f9;

  vertical-align: top;

  color: #4b5563;
}


.data-table tbody tr:hover {
  background: #fafafa;
}


.data-table tbody tr:last-child td {
  border-bottom: none;
}


/* =========================================================
   RESPONSIVE - TABLET
========================================================= */

@media (max-width: 1050px) {

  .dashboard-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }


  .quick-grid {
    grid-template-columns:
      repeat(3, minmax(0, 1fr));
  }

}


/* =========================================================
   RESPONSIVE - MOBILE
========================================================= */

@media (max-width: 700px) {

  .topbar {
    height: 60px;

    padding: 0 14px;
  }


  .brand-icon {
    width: 34px;
    height: 34px;

    font-size: 18px;
  }


  .brand-title {
    font-size: 17px;
  }


  .brand-subtitle {
    display: none;
  }


  .app-layout {
    display: block;

    min-height: calc(100vh - 60px);
  }


  .sidebar {
    width: 100%;

    min-height: auto;

    display: flex;

    overflow-x: auto;

    padding: 8px;

    border-right: none;

    border-bottom: 1px solid #e5e7eb;

    gap: 3px;

    scrollbar-width: thin;
  }


  .nav-item {
    width: auto;

    flex-shrink: 0;

    white-space: nowrap;

    padding: 9px 12px;

    margin: 0;

    font-size: 13px;
  }


  .nav-divider,
  .nav-heading {
    display: none;
  }


  .main-content {
    padding: 18px 13px;
  }


  .page-title {
    font-size: 23px;

    line-height: 29px;
  }


  .page-description {
    font-size: 13px;
  }


  .dashboard-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 10px;
  }


  .dashboard-card {
    min-height: 125px;

    padding: 15px;
  }


  .dashboard-icon {
    width: 36px;
    height: 36px;

    font-size: 18px;

    margin-bottom: 11px;
  }


  .dashboard-count {
    font-size: 23px;
  }


  .quick-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }


  .quick-button {
    min-height: 50px;
  }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media (max-width: 400px) {

  .dashboard-grid {
    grid-template-columns: 1fr;
  }


  .quick-grid {
    grid-template-columns: 1fr 1fr;
  }

}

</style>
