<script>

/* =========================================================
   PRODUCTS HUB
   JS.html
   Frontend Logic
========================================================= */


/* =========================================================
   START APPLICATION
========================================================= */

document.addEventListener('DOMContentLoaded', function () {

  setupNavigation();

  loadDashboard();

});


/* =========================================================
   NAVIGATION SETUP
========================================================= */

function setupNavigation() {

  const buttons =
    document.querySelectorAll('.nav-item');

  buttons.forEach(function (button) {

    button.addEventListener('click', function () {

      const section =
        button.getAttribute('data-section');

      setActiveNavigation(button);

      if (section === 'Dashboard') {

        loadDashboard();

      } else {

        loadSection(section);

      }

    });

  });

}


/* =========================================================
   ACTIVE NAVIGATION
========================================================= */

function setActiveNavigation(activeButton) {

  const buttons =
    document.querySelectorAll('.nav-item');

  buttons.forEach(function (button) {

    button.classList.remove('active');

  });

  if (activeButton) {

    activeButton.classList.add('active');

  }

}


/* =========================================================
   DASHBOARD
========================================================= */

function loadDashboard() {

  showLoading();

  google.script.run

    .withSuccessHandler(function (data) {

      renderDashboard(data);

    })

    .withFailureHandler(function (error) {

      showError(error);

    })

    .getDashboardData();

}


/* =========================================================
   RENDER DASHBOARD
========================================================= */

function renderDashboard(data) {

  const app =
    document.getElementById('app');


  app.innerHTML = `

    <div class="page-header">

      <h1 class="page-title">
        Good Afternoon 👋
      </h1>

      <div class="page-description">
        Your Cable Sales Product & Knowledge Hub
      </div>

    </div>


    <div class="search-container">

      <span class="search-icon">
        🔍
      </span>

      <input
        id="globalSearch"
        class="search-box"
        type="text"
        placeholder="Search products, cables, industries..."
        autocomplete="off"
      >

    </div>


    <div class="dashboard-grid">

      ${createDashboardCard(
        '📦',
        'Products',
        data['Products'],
        'Products'
      )}

      ${createDashboardCard(
        '🔧',
        'Applications',
        data['Applications'],
        'Applications'
      )}

      ${createDashboardCard(
        '🏭',
        'Industries',
        data['Industries'],
        'Industries'
      )}

      ${createDashboardCard(
        '🥊',
        'Competitors',
        data['Competitors'],
        'Competitors'
      )}

      ${createDashboardCard(
        '📚',
        'Cable Knowledge',
        data['Cable Knowledge'],
        'Cable Knowledge'
      )}

      ${createDashboardCard(
        '🧠',
        'Learning',
        data['Learning'],
        'Learning'
      )}

      ${createDashboardCard(
        '🚀',
        'Career Growth',
        data['Career Growth'],
        'Career Growth'
      )}

      ${createDashboardCard(
        '📄',
        'Documents',
        data['Documents'],
        'Documents'
      )}

    </div>


    <div class="section">

      <div class="section-title">
        Quick Access
      </div>

      <div class="quick-grid">

        ${createQuickButton('⚡ Special Cables')}

        ${createQuickButton('🚆 Railway')}

        ${createQuickButton('☀️ Solar')}

        ${createQuickButton('🛢️ Oil & Gas')}

        ${createQuickButton('🛡️ Defence')}

        ${createQuickButton('🏭 Industrial')}

      </div>

    </div>

  `;


  setupDashboardSearch();

}


/* =========================================================
   DASHBOARD CARD
========================================================= */

function createDashboardCard(
  icon,
  title,
  count,
  section
) {

  return `

    <div
      class="dashboard-card"
      onclick="openSection('${section}')"
    >

      <div class="dashboard-icon">
        ${icon}
      </div>

      <div class="dashboard-title">
        ${escapeHtml(title)}
      </div>

      <div class="dashboard-count">
        ${Number(count) || 0}
      </div>

    </div>

  `;

}


/* =========================================================
   QUICK BUTTON
========================================================= */

function createQuickButton(text) {

  return `

    <button
      class="quick-button"
      onclick="quickSearch('${escapeAttribute(text)}')"
    >
      ${escapeHtml(text)}
    </button>

  `;

}


/* =========================================================
   GLOBAL SEARCH
========================================================= */

function setupDashboardSearch() {

  const search =
    document.getElementById('globalSearch');

  if (!search) {
    return;
  }


  search.addEventListener('keydown', function (event) {

    if (event.key !== 'Enter') {
      return;
    }


    const value =
      search.value.trim();


    if (!value) {
      return;
    }


    searchProducts(value);

  });

}


/* =========================================================
   SEARCH PRODUCTS
========================================================= */

function searchProducts(searchText) {

  showLoading();


  google.script.run

    .withSuccessHandler(function (products) {

      const filtered =
        filterRecords(products, searchText);


      renderSearchResults(
        searchText,
        filtered
      );

    })

    .withFailureHandler(function (error) {

      showError(error);

    })

    .getProducts();

}


/* =========================================================
   FILTER RECORDS
========================================================= */

function filterRecords(
  records,
  searchText
) {

  const search =
    String(searchText)
      .toLowerCase()
      .trim();


  if (!search) {
    return records;
  }


  return records.filter(function (record) {

    return Object.values(record)
      .some(function (value) {

        return String(value)
          .toLowerCase()
          .includes(search);

      });

  });

}


/* =========================================================
   SEARCH RESULTS
========================================================= */

function renderSearchResults(
  searchText,
  records
) {

  const app =
    document.getElementById('app');


  let html = `

    <div class="page-header">

      <h1 class="page-title">
        Search Results
      </h1>

      <div class="page-description">
        Results for "${escapeHtml(searchText)}"
      </div>

    </div>

  `;


  if (!records.length) {

    html += `

      <div class="empty-state">

        <div class="empty-icon">
          🔍
        </div>

        <div class="empty-title">
          No products found
        </div>

        <div>
          Try another product name,
          category, application or industry.
        </div>

      </div>

    `;


    app.innerHTML = html;

    return;

  }


  html += createDataTable(records);


  app.innerHTML = html;

}


/* =========================================================
   LOAD SECTION
========================================================= */

function loadSection(section) {

  showLoading();


  google.script.run

    .withSuccessHandler(function (data) {

      renderSection(
        section,
        data
      );

    })

    .withFailureHandler(function (error) {

      showError(error);

    })

    .getSheetData(section);

}


/* =========================================================
   RENDER SECTION
========================================================= */

function renderSection(
  section,
  data
) {

  const app =
    document.getElementById('app');


  let html = `

    <div class="page-header">

      <h1 class="page-title">
        ${escapeHtml(section)}
      </h1>

      <div class="page-description">
        ${data.length} records
      </div>

    </div>

  `;


  if (!data.length) {

    html += `

      <div class="empty-state">

        <div class="empty-icon">
          📭
        </div>

        <div class="empty-title">
          No records yet
        </div>

        <div>
          Add data to the
          <b>${escapeHtml(section)}</b>
          Google Sheet to see it here.
        </div>

      </div>

    `;


    app.innerHTML = html;

    return;

  }


  html += createDataTable(data);


  app.innerHTML = html;

}


/* =========================================================
   DATA TABLE
========================================================= */

function createDataTable(data) {

  if (!data || !data.length) {
    return '';
  }


  const headers =
    Object.keys(data[0]);


  let html = `

    <div class="table-container">

      <table class="data-table">

        <thead>

          <tr>

            ${headers.map(function (header) {

              return `

                <th>
                  ${escapeHtml(header)}
                </th>

              `;

            }).join('')}

          </tr>

        </thead>


        <tbody>

  `;


  data.forEach(function (record) {

    html += '<tr>';


    headers.forEach(function (header) {

      html += `

        <td>
          ${formatCell(record[header])}
        </td>

      `;

    });


    html += '</tr>';

  });


  html += `

        </tbody>

      </table>

    </div>

  `;


  return html;

}


/* =========================================================
   FORMAT CELL
========================================================= */

function formatCell(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  return escapeHtml(
    String(value)
  ).replace(/\n/g, '<br>');

}


/* =========================================================
   OPEN SECTION
========================================================= */

function openSection(section) {

  const buttons =
    document.querySelectorAll('.nav-item');


  buttons.forEach(function (button) {

    if (
      button.getAttribute('data-section') === section
    ) {

      setActiveNavigation(button);

    }

  });


  loadSection(section);

}


/* =========================================================
   QUICK SEARCH
========================================================= */

function quickSearch(text) {

  const cleanText =
    text
      .replace(/[^\w\s&-]/g, '')
      .trim();


  const search =
    document.getElementById('globalSearch');


  if (search) {

    search.value = cleanText;

    searchProducts(cleanText);

  }

}


/* =========================================================
   LOADING
========================================================= */

function showLoading() {

  const app =
    document.getElementById('app');


  app.innerHTML = `

    <div class="loading">
      Loading...
    </div>

  `;

}


/* =========================================================
   ERROR
========================================================= */

function showError(error) {

  const app =
    document.getElementById('app');


  const message =
    error && error.message
      ? error.message
      : String(error);


  app.innerHTML = `

    <div class="error-box">

      <div class="error-title">
        Something went wrong
      </div>

      <div>
        ${escapeHtml(message)}
      </div>

    </div>

  `;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  return String(value)

    .replace(/&/g, '&amp;')

    .replace(/</g, '&lt;')

    .replace(/>/g, '&gt;')

    .replace(/"/g, '&quot;')

    .replace(/'/g, '&#039;');

}


/* =========================================================
   ATTRIBUTE ESCAPE
========================================================= */

function escapeAttribute(value) {

  return escapeHtml(value)
    .replace(/`/g, '&#096;');

}

</script>
