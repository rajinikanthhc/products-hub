<script>

/* =========================================================
   PRODUCTS HUB
   JS.html
   Frontend Logic
========================================================= */


/* =========================================================
   START APPLICATION
========================================================= */

/*
 * Sheet data does not change while a user is simply navigating.
 * Keep it in memory so returning to a section is instantaneous.
 */
const sectionDataCache = Object.create(null);
let dashboardDataCache = null;
let latestSectionRequest = 0;

document.addEventListener('DOMContentLoaded', function () {

  setupNavigation();

  loadDashboard();
  preloadSectionData();

});


/* =========================================================
   NAVIGATION SETUP
========================================================= */

function setupNavigation() {

  const buttons =
    document.querySelectorAll('.nav-item');

  buttons.forEach(function (button) {

    button.addEventListener('click', function () {

      const section =
        button.getAttribute('data-section');

      setActiveNavigation(button);

      if (section === 'Dashboard') {

        loadDashboard();

      } else {

        loadSection(section);

      }

    });

  });

}


/* =========================================================
   ACTIVE NAVIGATION
========================================================= */

function setActiveNavigation(activeButton) {

  const buttons =
    document.querySelectorAll('.nav-item');

  buttons.forEach(function (button) {

    button.classList.remove('active');

  });

  if (activeButton) {

    activeButton.classList.add('active');

  }

}


/* =========================================================
   DASHBOARD
========================================================= */

function loadDashboard() {

  if (dashboardDataCache) {
    renderDashboard(dashboardDataCache);
    return;
  }

  showLoading();

  google.script.run

    .withSuccessHandler(function (data) {

      dashboardDataCache = data;
      renderDashboard(data);

    })

    .withFailureHandler(function (error) {

      showError(error);

    })

    .getDashboardData();

}


/* =========================================================
   RENDER DASHBOARD
========================================================= */

/* =========================================================
   PRELOAD NAVIGATION DATA
   Runs quietly after the dashboard appears. If it fails, normal
   section loading continues to work as a fallback.
========================================================= */

function preloadSectionData() {

  google.script.run

    .withSuccessHandler(function(data) {

      Object.keys(data).forEach(function(section) {
        sectionDataCache[section] = data[section];
      });

    })

    .withFailureHandler(function() {
      /* Individual section requests remain available as fallback. */
    })

    .getAllSectionData();

}


function renderDashboard(data) {

  const app =
    document.getElementById('app');


  app.innerHTML = `

    <div class="page-header">

      <h1 class="page-title">
        Good Afternoon 👋
      </h1>

      <div class="page-description">
        Your Cable Sales Product & Knowledge Hub
      </div>

    </div>


    <div class="search-container">

      <span class="search-icon">
        🔍
      </span>

      <input
        id="globalSearch"
        class="search-box"
        type="text"
          placeholder="Search everything... then press Enter"
        autocomplete="off"
      >

    </div>


    <div class="dashboard-grid">

      ${createDashboardCard(
        '📦',
        'Products',
        data['Products'],
        'Products'
      )}

      ${createDashboardCard(
        '🔧',
        'Applications',
        data['Applications'],
        'Applications'
      )}

      ${createDashboardCard(
        '🏭',
        'Industries',
        data['Industries'],
        'Industries'
      )}

      ${createDashboardCard(
        '🥊',
        'Competitors',
        data['Competitors'],
        'Competitors'
      )}

      ${createDashboardCard(
        '📚',
        'Cable Knowledge',
        data['Cable Knowledge'],
        'Cable Knowledge'
      )}

      ${createDashboardCard(
        '🧠',
        'Learning',
        data['Learning'],
        'Learning'
      )}

      ${createDashboardCard(
        '🚀',
        'Career Growth',
        data['Career Growth'],
        'Career Growth'
      )}

      ${createDashboardCard(
        '📄',
        'Documents',
        data['Documents'],
        'Documents'
      )}

    </div>


    <div class="section">

      <div class="section-title">
        Quick Access
      </div>

      <div class="quick-grid">

        ${createQuickButton('⚡ Special Cables')}

        ${createQuickButton('🚆 Railway')}

        ${createQuickButton('☀️ Solar')}

        ${createQuickButton('🛢️ Oil & Gas')}

        ${createQuickButton('🛡️ Defence')}

        ${createQuickButton('🏭 Industrial')}

      </div>

    </div>

  `;


  setupDashboardSearch();

}


/* =========================================================
   DASHBOARD CARD
========================================================= */

function createDashboardCard(
  icon,
  title,
  count,
  section
) {

  return `

    <div
      class="dashboard-card"
      onclick="openSection('${section}')"
    >

      <div class="dashboard-icon">
        ${icon}
      </div>

      <div class="dashboard-title">
        ${escapeHtml(title)}
      </div>

      <div class="dashboard-count">
        ${Number(count) || 0}
      </div>

    </div>

  `;

}


/* =========================================================
   QUICK BUTTON
========================================================= */

function createQuickButton(text) {

  return `

    <button
      class="quick-button"
      onclick="quickSearch('${escapeAttribute(text)}')"
    >
      ${escapeHtml(text)}
    </button>

  `;

}


/* =========================================================
   GLOBAL SEARCH
========================================================= */

function setupDashboardSearch() {

  const search =
    document.getElementById('globalSearch');

  if (!search) {
    return;
  }


  let searchTimer;

  search.addEventListener('input', function() {

    clearTimeout(searchTimer);

    const value =
      search.value;

    if (!value.trim()) {
      renderDashboard(dashboardDataCache || {});
      return;
    }

    searchTimer = setTimeout(function() {
      searchAllSections(value);
    }, 180);

  });


  search.addEventListener('keydown', function (event) {

    if (event.key === 'Enter') {
      event.preventDefault();

      const value =
        search.value.trim();

      if (value) {
        searchAllSections(value);
      }
    }

  });

}


/* =========================================================
   SEARCH PRODUCTS
========================================================= */

function searchProducts(searchText) {

  searchAllSections(searchText);

}


function searchAllSections(searchText) {

  const rawSearch =
    String(searchText || '');

  if (!rawSearch.trim()) {
    return;
  }


  if (!Object.keys(sectionDataCache).length) {

    showLoading();

    google.script.run

      .withSuccessHandler(function(data) {

        Object.keys(data).forEach(function(section) {
          sectionDataCache[section] = data[section];
        });

        renderUniversalSearchResults(rawSearch);

      })

      .withFailureHandler(showError)

      .getAllSectionData();

    return;
  }


  renderUniversalSearchResults(rawSearch);

}


function renderUniversalSearchResults(searchText) {

  const normalizedSearch =
    searchText.trim().toLowerCase();

  const grouped = {};
  let total = 0;

  Object.keys(sectionDataCache).forEach(function(section) {

    const matches =
      (sectionDataCache[section] || [])
        .filter(function(record) {

          return Object.values(record)
            .some(function(value) {

              return String(value)
                .toLowerCase()
                .includes(normalizedSearch);

            });

        });

    if (matches.length) {
      grouped[section] = matches;
      total += matches.length;
    }

  });


  const app =
    document.getElementById('app');

  let html = `
    <div class="page-header">
      <h1 class="page-title">Search Results</h1>
      <div class="page-description">
        ${total} result${total === 1 ? '' : 's'} for
        "${escapeHtml(searchText)}"
      </div>
    </div>

    <div class="search-container universal-search-box">
      <span class="search-icon">🔍</span>
      <input
        id="globalSearch"
        class="search-box"
        type="text"
        value="${escapeAttribute(searchText)}"
        placeholder="Keep typing to refine your search..."
        autocomplete="off"
      >
    </div>
  `;


  if (!total) {

    html += `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">No results found</div>
        <div>Try a product, cable, industry, application, topic or document name.</div>
      </div>
    `;
  }


  if (total) {

    Object.keys(grouped).forEach(function(section) {

    const records = grouped[section];

    html += `
      <section class="universal-search-section">
        <div class="universal-search-heading">
          <span>${escapeHtml(section)}</span>
          <b>${records.length}</b>
        </div>

        <div class="universal-search-list">
          ${records.map(function(record) {
            return createUniversalSearchItem(section, record);
          }).join('')}
        </div>
      </section>
    `;

    });

  }

  app.innerHTML = html;
  setupDashboardSearch();

  const searchInput =
    document.getElementById('globalSearch');

  if (searchInput) {
    searchInput.focus();
    searchInput.setSelectionRange(
      searchText.length,
      searchText.length
    );
  }

}


function createUniversalSearchItem(section, record) {

  const titleBySection = {
    'Products': record['Product Name'],
    'Applications': record['Application'],
    'Industries': record['Industry'],
    'Competitors': record['Competitor'],
    'Cable Knowledge': record['Topic'] || record['Question'],
    'Learning': record['Topic'],
    'Career Growth': record['Goal'] || record['Topic'],
    'Documents': record['Document Name']
  };

  const title =
    titleBySection[section] || 'Untitled record';

  const idBySection = {
    'Products': record['Product ID'],
    'Applications': record['Application'],
    'Industries': record['Industry ID'],
    'Competitors': record['Competitor ID'],
    'Cable Knowledge': record['Knowledge ID'],
    'Learning': record['Learning ID'],
    'Career Growth': record['Career ID'],
    'Documents': record['Document ID']
  };

  const recordId =
    idBySection[section] || title;

  const details =
    Object.entries(record)
      .filter(function(entry) {
        return (
          entry[1] &&
          entry[0].indexOf('ID') === -1 &&
          entry[0] !== 'Last Updated'
        );
      })
      .slice(0, 3)
      .map(function(entry) {
        return `
          <span>
            <b>${escapeHtml(entry[0])}:</b>
            ${escapeHtml(entry[1])}
          </span>
        `;
      })
      .join('');

  return `
    <button
      class="universal-search-item"
      onclick="openUniversalSearchResult(
        '${escapeAttribute(section)}',
        '${escapeAttribute(recordId)}'
      )"
    >
      <small>${escapeHtml(section)}</small>
      <strong>${escapeHtml(title)}</strong>
      <div>${details}</div>
    </button>
  `;

}


function openUniversalSearchResult(section, recordId) {

  const idBySection = {
    'Products': 'Product ID',
    'Applications': 'Application',
    'Industries': 'Industry ID',
    'Competitors': 'Competitor ID',
    'Cable Knowledge': 'Knowledge ID',
    'Learning': 'Learning ID',
    'Career Growth': 'Career ID',
    'Documents': 'Document ID'
  };

  const idField =
    idBySection[section];

  const record =
    (sectionDataCache[section] || [])
      .find(function(item) {
        return String(item[idField] || '') ===
          String(recordId);
      });

  if (!record) {
    alert('Record not found.');
    return;
  }

  const oldModal =
    document.getElementById('universalSearchDetails');

  if (oldModal) {
    oldModal.remove();
  }

  const fields =
    Object.entries(record)
      .filter(function(entry) {
        return String(entry[1] || '').trim() !== '';
      })
      .map(function(entry) {
        return `
          <div class="detail-item">
            <div class="detail-label">${escapeHtml(entry[0])}</div>
            <div class="detail-value">${formatCell(entry[1])}</div>
          </div>
        `;
      })
      .join('');

  const modal =
    document.createElement('div');

  modal.id = 'universalSearchDetails';
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="modal-title">${escapeHtml(
            titleForSearchRecord(section, record)
          )}</div>
          <div class="modal-subtitle">${escapeHtml(section)}</div>
        </div>
        <button
          class="modal-close"
          onclick="closeUniversalSearchDetails()"
        >×</button>
      </div>
      <div class="detail-modal-body">
        <div class="detail-grid">${fields}</div>
      </div>
    </div>
  `;

  document.body.appendChild(modal);

}


function titleForSearchRecord(section, record) {

  const titleBySection = {
    'Products': record['Product Name'],
    'Applications': record['Application'],
    'Industries': record['Industry'],
    'Competitors': record['Competitor'],
    'Cable Knowledge': record['Topic'] || record['Question'],
    'Learning': record['Topic'],
    'Career Growth': record['Goal'] || record['Topic'],
    'Documents': record['Document Name']
  };

  return titleBySection[section] || 'Record Details';

}


function closeUniversalSearchDetails() {

  const modal =
    document.getElementById('universalSearchDetails');

  if (modal) {
    modal.remove();
  }

}


/* =========================================================
   FILTER RECORDS
========================================================= */

function filterRecords(
  records,
  searchText
) {

  const search =
    String(searchText)
      .toLowerCase()
      .trim();


  if (!search) {
    return records;
  }


  return records.filter(function (record) {

    return Object.values(record)
      .some(function (value) {

        return String(value)
          .toLowerCase()
          .includes(search);

      });

  });

}


/* =========================================================
   SEARCH RESULTS
========================================================= */

function renderSearchResults(
  searchText,
  records
) {

  const app =
    document.getElementById('app');


  let html = `

    <div class="page-header">

      <h1 class="page-title">
        Search Results
      </h1>

      <div class="page-description">
        Results for "${escapeHtml(searchText)}"
      </div>

    </div>

  `;


  if (!records.length) {

    html += `

      <div class="empty-state">

        <div class="empty-icon">
          🔍
        </div>

        <div class="empty-title">
          No products found
        </div>

        <div>
          Try another product name,
          category, application or industry.
        </div>

      </div>

    `;


    app.innerHTML = html;

    return;

  }


  html += createDataTable(records);


  app.innerHTML = html;

}


/* =========================================================
   LOAD SECTION
========================================================= */

function loadSection(section, forceRefresh) {

  const requestId = ++latestSectionRequest;

  if (
    !forceRefresh &&
    Object.prototype.hasOwnProperty.call(
      sectionDataCache,
      section
    )
  ) {

    renderSection(
      section,
      sectionDataCache[section]
    );

    return;
  }

  showLoading();


  google.script.run

    .withSuccessHandler(function (data) {

      sectionDataCache[section] = data;

      if (dashboardDataCache) {
        dashboardDataCache[section] = data.length;
      }

      /* Ignore an older response after the user navigates away. */
      if (requestId !== latestSectionRequest) {
        return;
      }

      renderSection(
        section,
        data
      );

    })

    .withFailureHandler(function (error) {

      if (requestId === latestSectionRequest) {
        showError(error);
      }

    })

    .getSheetData(section);

}


/* =========================================================
   RENDER SECTION
========================================================= */

function renderSection(section, data) {

  const app = document.getElementById('app');


  /* =======================================================
     PRODUCTS
  ======================================================= */

  if (section === 'Products') {

    renderProductsPage(data);

    return;

  }

  /* =======================================================
   APPLICATIONS
======================================================= */

if (section === 'Applications') {

  renderApplicationsPage(data);

  return;

}

/* =======================================================
   INDUSTRIES
======================================================= */

if (section === 'Industries') {

  renderIndustriesPage(data);

  return;

}

if (section === 'Competitors') {
  renderCompetitorsPage(data);
  return;
}

if (section === 'Cable Knowledge') {
  renderCableKnowledgePage(data);
  return;
}

if (section === 'Learning') {
  renderLearningPage(data);
  return;
}

if (section === 'Career Growth') {
    renderCareerGrowthPage(data);
    return;
  }

  if (section === 'Documents') {
  renderDocumentsPage(data);
  return;
}


  /* =======================================================
     OTHER SECTIONS
  ======================================================= */

  let html = `

    <div class="page-header">

      <h1 class="page-title">
        ${escapeHtml(section)}
      </h1>

      <div class="page-description">
        ${data.length} records
      </div>

    </div>

  `;


  if (!data.length) {

    html += `

      <div class="empty-state">

        <div class="empty-icon">
          📭
        </div>

        <div class="empty-title">
          No records yet
        </div>

        <div>
          Add data to the
          <b>${escapeHtml(section)}</b>
          Google Sheet to see it here.
        </div>

      </div>

    `;


    app.innerHTML = html;

    return;

  }


  html += createDataTable(data);

  app.innerHTML = html;

}


/* =========================================================
   PRODUCTS PAGE
========================================================= */

function renderProductsPage(products) {

  const app = document.getElementById('app');


  let categories = getUniqueValues(
    products,
    'Category'
  );

  let industries = getUniqueValues(
    products,
    'Industry'
  );

  let applications = getUniqueValues(
    products,
    'Application'
  );


  app.innerHTML = `

    <div class="page-header section-header">

      <div>

        <h1 class="page-title">
          Products
        </h1>

        <div class="page-description">
          ${products.length} product${products.length === 1 ? '' : 's'}
        </div>

      </div>


      <button
        class="primary-button"
        onclick="openAddProductModal()"
      >
        + Add Product
      </button>

    </div>


    <div class="product-toolbar">

      <div class="product-search">

        <span class="search-icon">
          🔍
        </span>

        <input
          id="productSearch"
          class="search-box"
          type="text"
          placeholder="Search products..."
          autocomplete="off"
        >

      </div>


      <select
        id="productCategoryFilter"
        class="filter-select"
      >

        <option value="">
          All Categories
        </option>

        ${categories.map(function(value) {

          return `
            <option value="${escapeAttribute(value)}">
              ${escapeHtml(value)}
            </option>
          `;

        }).join('')}

      </select>


      <select
        id="productIndustryFilter"
        class="filter-select"
      >

        <option value="">
          All Industries
        </option>

        ${industries.map(function(value) {

          return `
            <option value="${escapeAttribute(value)}">
              ${escapeHtml(value)}
            </option>
          `;

        }).join('')}

      </select>


      <select
        id="productApplicationFilter"
        class="filter-select"
      >

        <option value="">
          All Applications
        </option>

        ${applications.map(function(value) {

          return `
            <option value="${escapeAttribute(value)}">
              ${escapeHtml(value)}
            </option>
          `;

        }).join('')}

      </select>

    </div>


    <div
      id="productResults"
      class="products-grid"
    ></div>

  `;


  setupSortControl(
    '.product-toolbar',
    'Product Name',
    'Product Name',
    'productSearch'
  );

  window.productsData = products;


  renderProductCards(products);


  setupProductFilters();

}


/* =========================================================
   UNIQUE VALUES
========================================================= */

function getUniqueValues(data, field) {

  return [...new Set(

    data

      .map(function(item) {

        return String(item[field] || '').trim();

      })

      .filter(function(value) {

        return value !== '';

      })

  )].sort();

}


/* =========================================================
   SHARED PAGE SORTING
========================================================= */

function setupSortControl(
  toolbarSelector,
  primaryField,
  primaryLabel,
  searchId
) {

  const toolbar =
    document.querySelector(toolbarSelector);

  if (!toolbar) {
    return;
  }

  toolbar.insertAdjacentHTML(
    'beforeend',
    `
      <select
        class="filter-select sort-select"
        aria-label="Sort ${escapeAttribute(primaryLabel)}"
      >
        <option value="default">Sort: Default</option>
        <option value="az">${escapeHtml(primaryLabel)}: A–Z</option>
        <option value="za">${escapeHtml(primaryLabel)}: Z–A</option>
        <option value="newest">Last Updated: Newest</option>
        <option value="oldest">Last Updated: Oldest</option>
      </select>
    `
  );

  const sort =
    toolbar.querySelector('.sort-select');

  sort.addEventListener('change', function() {
    const search =
      document.getElementById(searchId);

    if (search) {
      search.dispatchEvent(
        new Event('input')
      );
    }
  });
}


function sortRecords(records, primaryField) {

  const sort =
    document.querySelector('.sort-select');

  const direction =
    sort ? sort.value : 'default';

  if (direction === 'default') {
    return records;
  }

  return records.slice().sort(function(a, b) {

    if (
      direction === 'newest' ||
      direction === 'oldest'
    ) {

      const aDate =
        Date.parse(a['Last Updated'] || '') || 0;

      const bDate =
        Date.parse(b['Last Updated'] || '') || 0;

      return direction === 'newest'
        ? bDate - aDate
        : aDate - bDate;
    }

    const comparison =
      String(a[primaryField] || '')
        .localeCompare(
          String(b[primaryField] || ''),
          undefined,
          {
            numeric: true,
            sensitivity: 'base'
          }
        );

    return direction === 'az'
      ? comparison
      : -comparison;
  });
}


/* =========================================================
   PRODUCT FILTERS
========================================================= */

function setupProductFilters() {

  const search =
    document.getElementById('productSearch');

  const category =
    document.getElementById(
      'productCategoryFilter'
    );

  const industry =
    document.getElementById(
      'productIndustryFilter'
    );

  const application =
    document.getElementById(
      'productApplicationFilter'
    );


  function applyFilters() {

    const searchText =
      search.value.trim().toLowerCase();

    const categoryValue =
      category.value.toLowerCase();

    const industryValue =
      industry.value.toLowerCase();

    const applicationValue =
      application.value.toLowerCase();


    const filtered =
      window.productsData.filter(function(product) {

        const searchable =
          Object.values(product)
            .join(' ')
            .toLowerCase();


        const matchesSearch =
          !searchText ||
          searchable.includes(searchText);


        const matchesCategory =
          !categoryValue ||
          String(product['Category'] || '')
            .toLowerCase() === categoryValue;


        const matchesIndustry =
          !industryValue ||
          String(product['Industry'] || '')
            .toLowerCase() === industryValue;


        const matchesApplication =
          !applicationValue ||
          String(product['Application'] || '')
            .toLowerCase() === applicationValue;


        return (
          matchesSearch &&
          matchesCategory &&
          matchesIndustry &&
          matchesApplication
        );

      });


    renderProductCards(filtered);

  }


  search.addEventListener(
    'input',
    applyFilters
  );

  category.addEventListener(
    'change',
    applyFilters
  );

  industry.addEventListener(
    'change',
    applyFilters
  );

  application.addEventListener(
    'change',
    applyFilters
  );

}


/* =========================================================
   PRODUCT CARDS
========================================================= */

function renderProductCards(products) {

  products =
    sortRecords(products, 'Product Name');

  const container =
    document.getElementById(
      'productResults'
    );


  if (!container) {
    return;
  }


  if (!products.length) {

    container.innerHTML = `

      <div class="empty-state product-empty">

        <div class="empty-icon">
          🔍
        </div>

        <div class="empty-title">
          No products found
        </div>

        <div>
          Try changing your search or filters.
        </div>

      </div>

    `;

    return;

  }


  container.innerHTML =
    products.map(function(product, index) {

      return createProductCard(
        product,
        index
      );

    }).join('');

}


/* =========================================================
   PRODUCT CARD
========================================================= */

function createProductCard(product, index) {

  const productId =
    product['Product ID'] || '';

  const productName =
    product['Product Name'] ||
    'Unnamed Product';

  const category =
    product['Category'] || '';

  const subCategory =
    product['Sub Category'] || '';

  const application =
    product['Application'] || '';

  const industry =

/* =========================================================

========================================================= */

function createProductDetailSection(
  title,
  fields
) {

  const validFields =
    fields.filter(function(field) {

      return String(
        field[1] || ''
      ).trim() !== '';

    });


  if (!validFields.length) {
    return '';
  }


  return `

    <div class="detail-section">

      <div class="detail-section-title">
        ${escapeHtml(title)}
      </div>


      <div class="detail-grid">

        ${validFields.map(function(field) {

          return `

            <div class="detail-item">

              <div class="detail-label">
                ${escapeHtml(field[0])}
              </div>

              <div class="detail-value">
                ${formatCell(field[1])}
              </div>

            </div>

          `;

        }).join('')}

      </div>

    </div>

  `;

}


/* =========================================================
   PRODUCT DETAIL TEXT
========================================================= */

function createProductDetailTextSection(
  title,
  value
) {

  if (
    value === null ||
    value === undefined ||

  ) {

  }

    <div class="detail-section">

      <div class="detail-section-title">

      </div>

}

/* =========================================================
   DATA TABLE
========================================================= */

function createDataTable(data) {

  if (!data || !data.length) {
    return '';
  }


  const headers =
    Object.keys(data[0]);


  let html = `

    <div class="table-container">

      <table class="data-table">

        <thead>

          <tr>

            ${headers.map(function (header) {

              return `

                <th>
                  ${escapeHtml(header)}
                </th>

              `;

            }).join('')}

          </tr>

        </thead>


        <tbody>

  `;


  data.forEach(function (record) {

    html += '<tr>';


    headers.forEach(function (header) {

      html += `

        <td>
          ${formatCell(record[header])}
        </td>

      `;

    });


    html += '</tr>';

  });


  html += `

        </tbody>

      </table>

    </div>

  `;


  return html;

}


/* =========================================================
   FORMAT CELL
========================================================= */

function formatCell(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  return escapeHtml(
    String(value)
  ).replace(/\n/g, '<br>');

}

   OPEN SECTION
========================================================= */

function openSection(section) {

  const buttons =
    document.querySelectorAll('.nav-item');


  buttons.forEach(function (button) {

/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  return String(value)

    .replace(/&/g, '&amp;')

    .replace(/</g, '&lt;')

    .replace(/>/g, '&gt;')

    .replace(/"/g, '&quot;')

    .replace(/'/g, '&#039;');

}


/* =========================================================
   ATTRIBUTE ESCAPE
========================================================= */

function escapeAttribute(value) {

  return escapeHtml(value)
    .replace(/`/g, '&#096;');

}

/* =========================================================
   SUBMIT PRODUCT
========================================================= */

function submitProduct(event) {

  event.preventDefault();


  const form =
    document.getElementById('addProductForm');


  const button =
    document.getElementById('saveProductButton');


  const formData =
    new FormData(form);


  const product = {

    productName:
      formData.get('productName'),

    category:
      formData.get('category'),

    subCategory:
      formData.get('subCategory'),

    application:
      formData.get('application'),

    industry:
      formData.get('industry'),

    voltage:
      formData.get('voltage'),

    sizeRange:
      formData.get('sizeRange'),

    standard:
      formData.get('standard'),

    keyFeatures:
      formData.get('keyFeatures'),

    salesPoints:
      formData.get('salesPoints'),

    customerType:
      formData.get('customerType'),

    competitors:
      formData.get('competitors'),

    productAdvantage:
      formData.get('productAdvantage'),

    technicalNotes:
      formData.get('technicalNotes'),

    datasheet:
      formData.get('datasheet'),

    catalogue:
      formData.get('catalogue'),

    image:
      formData.get('image'),

    status:
      formData.get('status')

  };


  button.disabled = true;

  button.textContent = 'Saving...';


  google.script.run

    .withSuccessHandler(function (result) {

      closeAddProductModal();

      showSuccessMessage(
        'Product ' +
        result.productId +
        ' added successfully.'
      );


      loadSection('Products', true);

    })

    .withFailureHandler(function (error) {

      button.disabled = false;

      button.textContent = 'Save Product';

      alert(
        error.message ||
        'Unable to save product.'
      );

    })

    .addProduct(product);

}


/* =========================================================

function showSuccessMessage(message) {

  const old =
    document.getElementById(

  if (old) {

  }


  const div =
    document.createElement('div');


  div.id = 'successMessage';

  div.textContent =
    '✓ ' + message;


  document.body.appendChild(div);

  }, 20);

  }, 3000);

}

/* =========================================================

========================================================= */

function confirmDeleteProduct(productId) {

  const product =
    window.productsData.find(function(item) {

      return String(
        item['Product ID'] || ''
      ) === String(productId);

    });


  if (!product) {

    alert('Product not found.');

    return;

  }


  const productName =
    product['Product Name'] ||
    productId;


  const confirmed =
    confirm(
      'Delete this product?\n\n' +
      productName +
      '\n' +
      productId +
      '\n\n' +
      'This will permanently remove it from the Products sheet.'
    );


  if (!confirmed) {
    return;
  }


  deleteProduct(productId);

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

function deleteProduct(productId) {

  const password =
    requestDeletePassword();

  if (password === null) {
    return;
  }

  google.script.run

    .withSuccessHandler(function(result) {

      closeProductDetails();


      showSuccessMessage(
        'Product ' +
        result.productId +
        ' deleted successfully.'
      );


      loadSection('Products', true);

    })

    .withFailureHandler(function(error) {

      alert(
        error.message ||
        'Unable to delete product.'
      );

    })

    .deleteProduct(
      productId,
      password
    );

}


/* =========================================================
   SUBMIT PRODUCT EDIT
========================================================= */

function submitProductEdit(event) {

  event.preventDefault();


  const form =
    document.getElementById(
      'editProductForm'
    );


  const button =
    document.getElementById(
      'updateProductButton'
    );


  const productId =
    form.dataset.productId;


  /*
   * Product ID is stored from the modal subtitle
   * fallback is extracted from current product.
   */

  let currentProductId =
    productId;


  if (!currentProductId) {

    const products =
      window.productsData || [];


    const productName =
      form.productName.value;


    const found =
      products.find(function(item) {

        return String(
          item['Product Name'] || ''
        ) === String(productName);

      });


    if (found) {

      currentProductId =
        found['Product ID'];

    }

  }


  if (!currentProductId) {

    alert(
      'Product ID could not be determined.'
    );

    return;

  }


  const product = {

    productName:
      form.productName.value,

    category:
      form.category.value,

    subCategory:
      form.subCategory.value,

    application:
      form.application.value,

    industry:
      form.industry.value,

    voltage:
      form.voltage.value,

    sizeRange:
      form.sizeRange.value,

    standard:
      form.standard.value,

    keyFeatures:
      form.keyFeatures.value,

    salesPoints:
      form.salesPoints.value,

    customerType:
      form.customerType.value,

    competitors:
      form.competitors.value,

    productAdvantage:
      form.productAdvantage.value,

    technicalNotes:
      form.technicalNotes.value,

    datasheet:
      form.datasheet.value,

    catalogue:
      form.catalogue.value,

    image:
      form.image.value,

    status:
      form.status.value

  };


  button.disabled = true;

  button.textContent =
    'Saving...';


  google.script.run

    .withSuccessHandler(function(result) {

      closeAddProductModal();

      showSuccessMessage(
        'Product ' +
        result.productId +
        ' updated successfully.'
      );


      loadSection('Products', true);

    })

    .withFailureHandler(function(error) {

      button.disabled = false;

      button.textContent =
        'Save Changes';


      alert(
        error.message ||
        'Unable to update product.'
      );

    })

    .updateProduct(
      currentProductId,
      product
    );

}

/* =========================================================
   APPLICATION FILTERS
========================================================= */

function setupApplicationFilters() {

  const search =
    document.getElementById(
      'applicationSearch'
    );

  const industry =
    document.getElementById(
      'applicationIndustryFilter'
    );

  const cable =
    document.getElementById(
      'applicationCableFilter'
    );


  function applyFilters() {

    const searchText =
      search.value
        .trim()
        .toLowerCase();

    const industryValue =
      industry.value
        .trim()
        .toLowerCase();

    const cableValue =
      cable.value
        .trim()
        .toLowerCase();


    const filtered =
      window.applicationsData.filter(
        function(application) {

          const searchable =
            Object.values(application)
              .join(' ')
              .toLowerCase();


          const matchesSearch =
            !searchText ||
            searchable.includes(searchText);


          const matchesIndustry =
            !industryValue ||
            String(
              application['Industry'] || ''
            )
              .toLowerCase() ===
              industryValue;


          const matchesCable =
            !cableValue ||
            String(
              application['Cable Required'] || ''
            )
              .toLowerCase() ===
              cableValue;


          return (
            matchesSearch &&
            matchesIndustry &&
            matchesCable
          );

        }
      );


    renderApplicationCards(
      filtered
    );

  }


  search.addEventListener(
    'input',
    applyFilters
  );

  industry.addEventListener(
    'change',
    applyFilters
  );

  cable.addEventListener(
    'change',
    applyFilters
  );

}

function confirmDeleteApplication(

) {

/* =========================================================
   INDUSTRY FILTERS
========================================================= */

function setupIndustryFilters() {

  const search =
    document.getElementById(
      'industrySearch'
    );


  const segment =
    document.getElementById(
      'industrySegmentFilter'
    );


  const cable =
    document.getElementById(
      'industryCableFilter'
    );


  function applyFilters() {

    const searchText =
      search.value
        .trim()
        .toLowerCase();


    const segmentValue =
      segment.value
        .trim()
        .toLowerCase();


    const cableValue =
      cable.value
        .trim()
        .toLowerCase();


    const filtered =
      window.industriesData.filter(
        function(industry) {

          const searchable =
            Object.values(industry)
              .join(' ')
              .toLowerCase();


          const matchesSearch =
            !searchText ||
            searchable.includes(
              searchText
            );


          const matchesSegment =
            !segmentValue ||
            String(
              industry['Major Segments'] || ''
            )
              .toLowerCase()
              .includes(
                segmentValue
              );


          const matchesCable =
            !cableValue ||
            String(
              industry['Cables Used'] || ''
            )
              .toLowerCase()
              .includes(
                cableValue
              );


          return (
            matchesSearch &&
            matchesSegment &&
            matchesCable
          );

        }
      );


    renderIndustryCards(
      filtered
    );

  }


  search.addEventListener(
    'input',
    applyFilters
  );


  segment.addEventListener(
    'change',
    applyFilters
  );


  cable.addEventListener(
    'change',
    applyFilters
  );

}

/* =========================================================
   FILTERS
========================================================= */

function setupCompetitorFilters() {

  const search =
    document.getElementById(
      'competitorSearch'
    );

  const industry =
    document.getElementById(
      'competitorIndustryFilter'
    );

  const product =
    document.getElementById(
      'competitorProductFilter'
    );


  function applyFilters() {

    const searchText =
      search.value
        .trim()
        .toLowerCase();

    const industryValue =
      industry.value
        .trim()
        .toLowerCase();

    const productValue =
      product.value
        .trim()
        .toLowerCase();


    const filtered =
      window.competitorsData.filter(
        function(competitor) {

          const searchable =
            Object.values(competitor)
              .join(' ')
              .toLowerCase();


          const matchesSearch =
            !searchText ||
            searchable.includes(
              searchText
            );


          const matchesIndustry =
            !industryValue ||
            String(
              competitor[
                'Industries Served'
              ] || ''
            )
              .toLowerCase()
              .includes(
                industryValue
              );


          const matchesProduct =
            !productValue ||
            String(
              competitor[
                'Main Products'
              ] || ''
            )
              .toLowerCase()
              .includes(
                productValue
              );


          return (
            matchesSearch &&
            matchesIndustry &&
            matchesProduct
          );

        }
      );


    renderCompetitorCards(
      filtered
    );

  }


  search.addEventListener(
    'input',
    applyFilters
  );

  industry.addEventListener(
    'change',
    applyFilters
  );

  product.addEventListener(
    'change',
    applyFilters
  );

}

/* =========================================================
   DETAIL SECTION
========================================================= */

function createCompetitorDetailSection(
  title,
  fields
) {

  const validFields =
    fields.filter(function(field) {

      return String(
        field[1] || ''
      ).trim() !== '';

    });


  if (!validFields.length) {
    return '';
  }


  return `

    <div class="detail-section">

      <div class="detail-section-title">
        ${escapeHtml(title)}
      </div>


      <div class="detail-grid">

        ${validFields.map(
          function(field) {

            return `

              <div class="detail-item">

                <div class="detail-label">
                  ${escapeHtml(field[0])}
                </div>

                <div class="detail-value">
                  ${formatCell(field[1])}
                </div>

              </div>

            `;

          }
        ).join('')}

      </div>

    </div>

  `;

}


/* =========================================================
   DETAIL TEXT
========================================================= */

function createCompetitorDetailTextSection(
  title,
  value
) {

  if (
    value === null ||
    value === undefined ||
    String(value).trim() === ''
  ) {
    return '';
  }


  return `

    <div class="detail-section">

      <div class="detail-section-title">
        ${escapeHtml(title)}
      </div>

      <div class="detail-text">
        ${formatCell(value)}
      </div>

    </div>

  `;

}

/* =========================================================

========================================================= */

function submitCompetitor(event) {

  event.preventDefault();


  const form =
    document.getElementById(
      'addCompetitorForm'
    );

  const button =
    document.getElementById(
      'saveCompetitorButton'
    );

  const data =
    new FormData(form);


  const competitor = {

    competitor:
      data.get('competitor'),

    companyType:
      data.get('companyType'),

    mainProducts:
      data.get('mainProducts'),

    industriesServed:
      data.get('industriesServed'),

    applications:
      data.get('applications'),

    strengths:
      data.get('strengths'),

    weaknesses:
      data.get('weaknesses'),

    pricePosition:
      data.get('pricePosition'),

    marketPosition:
      data.get('marketPosition'),

    customerType:
      data.get('customerType'),

    typicalBuyers:
      data.get('typicalBuyers'),

    keyDifferentiators:
      data.get('keyDifferentiators'),

    polycabAdvantage:
      data.get('polycabAdvantage'),

    commonObjections:
      data.get('commonObjections'),

    howToRespond:
      data.get('howToRespond'),

    opportunityStrategy:
      data.get('opportunityStrategy'),

    relatedProducts:
      data.get('relatedProducts'),

    status:
      data.get('status')

  };


  button.disabled = true;

  button.textContent =
    'Saving...';


  google.script.run

    .withSuccessHandler(function(result) {

      closeCompetitorModal();

      showSuccessMessage(
        'Competitor ' +
        result.competitorId +
        ' added successfully.'
      );

      loadSection(
        'Competitors',
        true
      );

    })

    .withFailureHandler(function(error) {

      button.disabled = false;

      button.textContent =
        'Save Competitor';

      alert(
        error.message ||
        'Unable to save competitor.'
      );

    })

    .addCompetitor(
      competitor
    );

}

  const button =
    document.getElementById(
      'updateCompetitorButton'
    );


  const id =
    document.querySelector(
      '#competitorDetailsModal'
    )?.dataset?.competitorId ||
    window.editingCompetitorId;


  if (!id) {

    /*
     * Recover ID from the selected
     * competitor using competitor name.
     */

    const name =
      form.competitor.value;

    const found =
      (window.competitorsData || [])
        .find(function(item) {

          return String(
            item['Competitor'] || ''
          ).trim() ===
          String(name).trim();

        });

    if (found) {
      window.editingCompetitorId =
        found['Competitor ID'];
    }

  }


  const competitorId =
    window.editingCompetitorId;


  if (!competitorId) {

    alert(
      'Competitor ID could not be found.'
    );

    return;

  }


  const competitor = {

    competitor:
      form.competitor.value,

    companyType:
      form.companyType.value,

    mainProducts:
      form.mainProducts.value,

    industriesServed:
      form.industriesServed.value,

    applications:
      form.applications.value,

    strengths:
      form.strengths.value,

    weaknesses:
      form.weaknesses.value,

    pricePosition:
      form.pricePosition.value,

    marketPosition:
      form.marketPosition.value,

    customerType:
      form.customerType.value,

    typicalBuyers:
      form.typicalBuyers.value,

    keyDifferentiators:
      form.keyDifferentiators.value,

    polycabAdvantage:
      form.polycabAdvantage.value,

    commonObjections:
      form.commonObjections.value,

    howToRespond:
      form.howToRespond.value,

    opportunityStrategy:
      form.opportunityStrategy.value,

    relatedProducts:
      form.relatedProducts.value,

    status:
      form.status.value

  };


  button.disabled = true;

  button.textContent =
    'Saving...';


  google.script.run

    .withSuccessHandler(function(result) {

      window.editingCompetitorId = null;

      closeCompetitorModal();

      showSuccessMessage(
        'Competitor updated successfully.'
      );

      loadSection(
        'Competitors',
        true
      );

    })

    .withFailureHandler(function(error) {

      button.disabled = false;

      button.textContent =
        'Save Changes';

      alert(
        error.message ||
        'Unable to update competitor.'
      );

    })

    .updateCompetitor(
      competitorId,
      competitor
    );

}


/* =========================================================
   DELETE CONFIRMATION
========================================================= */

function confirmDeleteCompetitor(
  competitorId
) {

  const competitor =
    (window.competitorsData || [])
      .find(function(item) {

        return String(
          item['Competitor ID'] || ''
        ) ===
        String(competitorId);

      });


  if (!competitor) {

    alert('Competitor not found.');

    return;

  }


  const confirmed =
    confirm(
      'Delete this competitor?\n\n' +
      competitor['Competitor'] +
      '\n' +
      competitorId +
      '\n\n' +
      'This will permanently remove it from the Competitors sheet.'
    );


  if (!confirmed) {
    return;
  }

  const password =
    requestDeletePassword();

  if (password === null) {
    return;
  }


  google.script.run

    .withSuccessHandler(function(result) {

      closeCompetitorDetails();

      showSuccessMessage(
        'Competitor ' +
        result.competitorId +
        ' deleted successfully.'
      );

      loadSection(
        'Competitors',
        true
      );

    })

    .withFailureHandler(function(error) {

      alert(
        error.message ||
        'Unable to delete competitor.'
      );

    })

    .deleteCompetitor(
      competitorId,
      password
    );

}

/* =========================================================
   FILTERS
========================================================= */

function setupKnowledgeFilters() {

  const search =
    document.getElementById(
      'knowledgeSearch'
    );

  const category =
    document.getElementById(
      'knowledgeCategoryFilter'
    );

  const level =
    document.getElementById(
      'knowledgeLevelFilter'
    );


  function applyFilters() {

    const searchText =
      search.value
        .trim()
        .toLowerCase();

    const categoryValue =
      category.value
        .trim()
        .toLowerCase();

    const levelValue =
      level.value
        .trim()
        .toLowerCase();


    const filtered =
      window.cableKnowledgeData.filter(
        function(item) {

          const searchable =
            Object.values(item)
              .join(' ')
              .toLowerCase();


          return (

            (!searchText ||
              searchable.includes(
                searchText
              ))

            &&

            (!categoryValue ||
              String(
                item['Category'] || ''
              )
                .toLowerCase()
                .includes(
                  categoryValue
                ))

            &&

            (!levelValue ||
              String(
                item['Learning Level'] || ''
              )
                .toLowerCase()
                .includes(
                  levelValue
                ))

          );

        }
      );


    renderKnowledgeCards(
      filtered
    );

  }


  search.addEventListener(
    'input',
    applyFilters
  );

  category.addEventListener(
    'change',
    applyFilters
  );

  level.addEventListener(
    'change',
    applyFilters
  );

}

      data.get('relatedIndustries'),

    documentLink:

    source:
      data.get('source'),

    status:

  };


  button.disabled = true;

  button.textContent =

  google.script.run

function submitKnowledgeEdit(
  event
) {

  event.preventDefault();


  const form =
    document.getElementById(
      'editKnowledgeForm'
    );

  const button =
    document.getElementById(
      'updateKnowledgeButton'
    );


  const knowledgeId =
    window.editingKnowledgeId;


  if (!knowledgeId) {

    alert(
      'Knowledge ID not found.'
    );

    return;

  }


  const knowledge = {

    topic:
      form.topic.value,

    category:
      form.category.value,

    subCategory:
      form.subCategory.value,

    question:
      form.question.value,

    answer:
      form.answer.value,

    keyPoints:
      form.keyPoints.value,

    salesRelevance:
      form.salesRelevance.value,

    learningLevel:
      form.learningLevel.value,

    relatedProducts:
      form.relatedProducts.value,

    relatedApplications:
      form.relatedApplications.value,

    relatedIndustries:
      form.relatedIndustries.value,

    documentLink:
      form.documentLink.value,

    source:
      form.source.value,

    status:
      form.status.value

  };


  button.disabled = true;

  button.textContent =
    'Saving...';


  google.script.run

    .withSuccessHandler(function() {

      window.editingKnowledgeId =
        null;

      closeKnowledgeModal();

      showSuccessMessage(
        'Knowledge updated successfully.'
      );

      loadSection(
        'Cable Knowledge',
        true
      );

    })

    .withFailureHandler(function(error) {

      button.disabled = false;

      button.textContent =
        'Save Changes';

      alert(
        error.message ||
        'Unable to update knowledge.'
      );

    })

    .updateKnowledge(
      knowledgeId,
      knowledge
    );

}

function confirmDeleteKnowledge(
  knowledgeId
) {

  const item =
    (window.cableKnowledgeData || [])
      .find(function(row) {

        return String(
          row['Knowledge ID'] || ''
        ) ===
        String(knowledgeId);

      });


  if (!item) {

    alert(
      'Knowledge not found.'
    );

    return;

  }


  const confirmed =
    confirm(
      'Delete this knowledge topic?\n\n' +
      (
        item['Topic'] ||
        item['Question'] ||
        ''
      ) +
      '\n' +
      knowledgeId +
      '\n\n' +
      'This will permanently remove it from the Cable Knowledge sheet.'
    );


  if (!confirmed) {
    return;
  }

  const password =
    requestDeletePassword();

  if (password === null) {
    return;
  }


  google.script.run

    .withSuccessHandler(function(result) {

      closeKnowledgeDetails();

      showSuccessMessage(
        'Knowledge ' +
        result.knowledgeId +
        ' deleted successfully.'
      );

      loadSection(
        'Cable Knowledge',
        true
      );

    })

    .withFailureHandler(function(error) {

      alert(
        error.message ||
        'Unable to delete knowledge.'
      );

    })

    .deleteKnowledge(
      knowledgeId,
      password
    );

}

/* =========================================================
   FILTERS
========================================================= */

function setupLearningFilters() {

  const search =
    document.getElementById(
      'learningSearch'
    );

  const category =
    document.getElementById(
      'learningCategoryFilter'
    );

  const level =
    document.getElementById(
      'learningLevelFilter'
    );


  function applyFilters() {

    const searchText =
      search.value
        .trim()
        .toLowerCase();

    const categoryValue =
      category.value
        .trim()
        .toLowerCase();

    const levelValue =
      level.value
        .trim()
        .toLowerCase();


    const filtered =
      window.learningData.filter(
        function(item) {

          const searchable =
            Object.values(item)
              .join(' ')
              .toLowerCase();

          return (

            (!searchText ||
              searchable.includes(
                searchText
              ))

            &&

            (!categoryValue ||
              String(
                item['Category'] || ''
              )
                .toLowerCase()
                .includes(
                  categoryValue
                ))

            &&

            (!levelValue ||
              String(
                item['Learning Level'] || ''
              )
                .toLowerCase()
                .includes(
                  levelValue
                ))

          );

        }
      );


    renderLearningCards(
      filtered
    );

  }


  search.addEventListener(
    'input',
    applyFilters
  );

  category.addEventListener(
    'change',
    applyFilters
  );

  level.addEventListener(
    'change',
    applyFilters
  );

}

    </div>

========================================================= */

function confirmDeleteLearning(
  learningId
) {

  const item =
    (window.learningData || [])
      .find(function(row) {

        return String(
          row['Learning ID'] || ''
        ) ===
        String(learningId);

      });


  if (!item) {

    alert(
      'Learning record not found.'
    );

    return;

  }


  const confirmed =
    confirm(
      'Delete this learning topic?\n\n' +
      (
        item['Topic'] || ''
      ) +
      '\n' +
      learningId +
      '\n\n' +
      'This will permanently remove it from the Learning sheet.'
    );


  if (!confirmed) {
    return;
  }

  const password =
    requestDeletePassword();

  if (password === null) {
    return;
  }


  google.script.run

    .withSuccessHandler(function(result) {

      closeLearningDetails();

      showSuccessMessage(
        'Learning ' +
        result.learningId +
        ' deleted successfully.'
      );

      loadSection(
        'Learning',
        true
      );

    })

    .withFailureHandler(function(error) {

      alert(
        error.message ||
        'Unable to delete learning.'
      );

    })

    .deleteLearning(
      learningId,
      password
    );

}

function setupCareerGrowthFilters() {
  const search = document.getElementById('careerSearch');
  const category = document.getElementById('careerCategoryFilter');
  const level = document.getElementById('careerLevelFilter');
  const subCategory = document.getElementById('careerSubCategoryFilter');

  function applyFilters() {
    const searchText = search.value.trim().toLowerCase();
    const categoryValue = category.value.toLowerCase();
    const levelValue = level.value.toLowerCase();
    const subCategoryValue = subCategory.value.toLowerCase();

    const filtered = window.careerGrowthData.filter(career => {
      const searchable = Object.values(career).join(' ').toLowerCase();

      return (
        (!searchText || searchable.includes(searchText)) &&
        (!categoryValue || String(career['Category'] || '').toLowerCase() === categoryValue) &&
        (!levelValue || String(career['Learning Level'] || '').toLowerCase() === levelValue) &&
        (!subCategoryValue || String(career['Sub Category'] || '').toLowerCase() === subCategoryValue)
      );
    });

    renderCareerGrowthCards(filtered);
  }

  search.addEventListener('input', applyFilters);
  category.addEventListener('change', applyFilters);
  level.addEventListener('change', applyFilters);
  subCategory.addEventListener('change', applyFilters);
}

/* =========================================================

========================================================= */

function createDocumentDetailSection(
  title,
  fields
) {

  const valid =
    fields.filter(function(field) {

      return String(
        field[1] || ''
      ).trim() !== '';

    });


  if (!valid.length) {
    return '';
  }


  return `

    <div class="detail-section">

      <div class="detail-section-title">
        ${escapeHtml(title)}
      </div>


      <div class="detail-grid">

        ${valid.map(function(field) {

          return `

            <div class="detail-item">

              <div class="detail-label">
                ${escapeHtml(field[0])}
              </div>

              <div class="detail-value">
                ${formatCell(field[1])}
              </div>

            </div>

          `;

        }).join('')}

      </div>

    </div>

  `;

}


function createDocumentDetailText(
  title,
  value
) {

  if (
    !value ||
    String(value).trim() === ''
  ) {
    return '';
  }


  return `

    <div class="detail-section">

      <div class="detail-section-title">
        ${escapeHtml(title)}
      </div>

      <div class="detail-text">
        ${formatCell(value)}
      </div>

    </div>

  `;

}

    status:

function submitDocumentEdit(event) {

  event.preventDefault();


  const form =
    document.getElementById(
      'editDocumentForm'
    );

  const button =
    document.getElementById(
      'updateDocumentButton'
    );

  const documentId =
    window.editingDocumentId;


  if (!documentId) {

    alert(
      'Document ID not found.'
    );

    return;

  }


  const documentData = {

    documentName:
      form.documentName.value,

    documentType:
      form.documentType.value,

    category:
      form.category.value,

    relatedProducts:
      form.relatedProducts.value,

    relatedIndustries:
      form.relatedIndustries.value,

    description:
      form.description.value,

    documentLink:
      form.documentLink.value,

    source:
      form.source.value,

    learningLevel:
      form.learningLevel.value,

    status:
      form.status.value

  };


  button.disabled = true;

  button.textContent =
    'Saving...';


  google.script.run

    .withSuccessHandler(function() {

      window.editingDocumentId =
        null;

      closeDocumentModal();

      showSuccessMessage(
        'Document updated successfully.'
      );

      loadSection(
        'Documents',
        true
      );

    })

    .withFailureHandler(function(error) {

      button.disabled = false;

      button.textContent =
        'Save Changes';

      alert(
        error.message ||
        'Unable to update document.'
      );

    })

    .updateDocument(
      documentId,
      documentData
    );

}


/* =========================================================
   DELETE DOCUMENT
========================================================= */

function confirmDeleteDocument(documentId) {

  const item =
    (window.documentsData || [])
      .find(function(row) {

        return String(
          row['Document ID'] || ''
        ) ===
        String(documentId);

      });


  if (!item) {

    alert(
      'Document not found.'
    );

    return;

  }


  const confirmed =
    confirm(
      'Delete this document?\n\n' +
      (
        item['Document Name'] || ''
      ) +
      '\n' +
      documentId +
      '\n\n' +
      'This will permanently remove it from the Documents sheet.'
    );


  if (!confirmed) {
    return;
  }

  const password =
    requestDeletePassword();

  if (password === null) {
    return;
  }


  google.script.run

    .withSuccessHandler(function(result) {

      closeDocumentDetails();

      showSuccessMessage(
        'Document ' +
        result.documentId +
        ' deleted successfully.'
      );

      loadSection(
        'Documents',
        true
      );

    })

    .withFailureHandler(function(error) {

      alert(
        error.message ||
        'Unable to delete document.'
      );

    })

    .deleteDocument(
      documentId,
      password
    );

}
