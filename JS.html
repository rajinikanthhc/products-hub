<script>

/* =========================================================
   PRODUCTS HUB
   JS.html
   Frontend Logic
========================================================= */


/* =========================================================
   START APPLICATION
========================================================= */

document.addEventListener('DOMContentLoaded', function () {

  setupNavigation();

  loadDashboard();

});


/* =========================================================
   NAVIGATION SETUP
========================================================= */

function setupNavigation() {

  const buttons =
    document.querySelectorAll('.nav-item');

  buttons.forEach(function (button) {

    button.addEventListener('click', function () {

      const section =
        button.getAttribute('data-section');

      setActiveNavigation(button);

      if (section === 'Dashboard') {

        loadDashboard();

      } else {

        loadSection(section);

      }

    });

  });

}


/* =========================================================
   ACTIVE NAVIGATION
========================================================= */

function setActiveNavigation(activeButton) {

  const buttons =
    document.querySelectorAll('.nav-item');

  buttons.forEach(function (button) {

    button.classList.remove('active');

  });

  if (activeButton) {

    activeButton.classList.add('active');

  }

}


/* =========================================================
   DASHBOARD
========================================================= */

function loadDashboard() {

  showLoading();

  google.script.run

    .withSuccessHandler(function (data) {

      renderDashboard(data);

    })

    .withFailureHandler(function (error) {

      showError(error);

    })

    .getDashboardData();

}


/* =========================================================
   RENDER DASHBOARD
========================================================= */

function renderDashboard(data) {

  const app =
    document.getElementById('app');


  app.innerHTML = `

    <div class="page-header">

      <h1 class="page-title">
        Good Afternoon 👋
      </h1>

      <div class="page-description">
        Your Cable Sales Product & Knowledge Hub
      </div>

    </div>


    <div class="search-container">

      <span class="search-icon">
        🔍
      </span>

      <input
        id="globalSearch"
        class="search-box"
        type="text"
        placeholder="Search products, cables, industries..."
        autocomplete="off"
      >

    </div>


    <div class="dashboard-grid">

      ${createDashboardCard(
        '📦',
        'Products',
        data['Products'],
        'Products'
      )}

      ${createDashboardCard(
        '🔧',
        'Applications',
        data['Applications'],
        'Applications'
      )}

      ${createDashboardCard(
        '🏭',
        'Industries',
        data['Industries'],
        'Industries'
      )}

      ${createDashboardCard(
        '🥊',
        'Competitors',
        data['Competitors'],
        'Competitors'
      )}

      ${createDashboardCard(
        '📚',
        'Cable Knowledge',
        data['Cable Knowledge'],
        'Cable Knowledge'
      )}

      ${createDashboardCard(
        '🧠',
        'Learning',
        data['Learning'],
        'Learning'
      )}

      ${createDashboardCard(
        '🚀',
        'Career Growth',
        data['Career Growth'],
        'Career Growth'
      )}

      ${createDashboardCard(
        '📄',
        'Documents',
        data['Documents'],
        'Documents'
      )}

    </div>


    <div class="section">

      <div class="section-title">
        Quick Access
      </div>

      <div class="quick-grid">

        ${createQuickButton('⚡ Special Cables')}

        ${createQuickButton('🚆 Railway')}

        ${createQuickButton('☀️ Solar')}

        ${createQuickButton('🛢️ Oil & Gas')}

        ${createQuickButton('🛡️ Defence')}

        ${createQuickButton('🏭 Industrial')}

      </div>

    </div>

  `;


  setupDashboardSearch();

}


/* =========================================================
   DASHBOARD CARD
========================================================= */

function createDashboardCard(
  icon,
  title,
  count,
  section
) {

  return `

    <div
      class="dashboard-card"
      onclick="openSection('${section}')"
    >

      <div class="dashboard-icon">
        ${icon}
      </div>

      <div class="dashboard-title">
        ${escapeHtml(title)}
      </div>

      <div class="dashboard-count">
        ${Number(count) || 0}
      </div>

    </div>

  `;

}


/* =========================================================
   QUICK BUTTON
========================================================= */

function createQuickButton(text) {

  return `

    <button
      class="quick-button"
      onclick="quickSearch('${escapeAttribute(text)}')"
    >
      ${escapeHtml(text)}
    </button>

  `;

}


/* =========================================================
   GLOBAL SEARCH
========================================================= */

function setupDashboardSearch() {

  const search =
    document.getElementById('globalSearch');

  if (!search) {
    return;
  }


  search.addEventListener('keydown', function (event) {

    if (event.key !== 'Enter') {
      return;
    }


    const value =
      search.value.trim();


    if (!value) {
      return;
    }


    searchProducts(value);

  });

}


/* =========================================================
   SEARCH PRODUCTS
========================================================= */

function searchProducts(searchText) {

  showLoading();


  google.script.run

    .withSuccessHandler(function (products) {

      const filtered =
        filterRecords(products, searchText);


      renderSearchResults(
        searchText,
        filtered
      );

    })

    .withFailureHandler(function (error) {

      showError(error);

    })

    .getProducts();

}


/* =========================================================
   FILTER RECORDS
========================================================= */

function filterRecords(
  records,
  searchText
) {

  const search =
    String(searchText)
      .toLowerCase()
      .trim();


  if (!search) {
    return records;
  }


  return records.filter(function (record) {

    return Object.values(record)
      .some(function (value) {

        return String(value)
          .toLowerCase()
          .includes(search);

      });

  });

}


/* =========================================================
   SEARCH RESULTS
========================================================= */

function renderSearchResults(
  searchText,
  records
) {

  const app =
    document.getElementById('app');


  let html = `

    <div class="page-header">

      <h1 class="page-title">
        Search Results
      </h1>

      <div class="page-description">
        Results for "${escapeHtml(searchText)}"
      </div>

    </div>

  `;


  if (!records.length) {

    html += `

      <div class="empty-state">

        <div class="empty-icon">
          🔍
        </div>

        <div class="empty-title">
          No products found
        </div>

        <div>
          Try another product name,
          category, application or industry.
        </div>

      </div>

    `;


    app.innerHTML = html;

    return;

  }


  html += createDataTable(records);


  app.innerHTML = html;

}


/* =========================================================
   LOAD SECTION
========================================================= */

function loadSection(section) {

  showLoading();


  google.script.run

    .withSuccessHandler(function (data) {

      renderSection(
        section,
        data
      );

    })

    .withFailureHandler(function (error) {

      showError(error);

    })

    .getSheetData(section);

}


/* =========================================================
   RENDER SECTION
========================================================= */

function renderSection(section, data) {

  const app = document.getElementById('app');


  /* =======================================================
     PRODUCTS
  ======================================================= */

  if (section === 'Products') {

    renderProductsPage(data);

    return;

  }


  /* =======================================================
     OTHER SECTIONS
  ======================================================= */

  let html = `

    <div class="page-header">

      <h1 class="page-title">
        ${escapeHtml(section)}
      </h1>

      <div class="page-description">
        ${data.length} records
      </div>

    </div>

  `;


  if (!data.length) {

    html += `

      <div class="empty-state">

        <div class="empty-icon">
          📭
        </div>

        <div class="empty-title">
          No records yet
        </div>

        <div>
          Add data to the
          <b>${escapeHtml(section)}</b>
          Google Sheet to see it here.
        </div>

      </div>

    `;


    app.innerHTML = html;

    return;

  }


  html += createDataTable(data);

  app.innerHTML = html;

}


/* =========================================================
   PRODUCTS PAGE
========================================================= */

function renderProductsPage(products) {

  const app = document.getElementById('app');


  let categories = getUniqueValues(
    products,
    'Category'
  );

  let industries = getUniqueValues(
    products,
    'Industry'
  );

  let applications = getUniqueValues(
    products,
    'Application'
  );


  app.innerHTML = `

    <div class="page-header section-header">

      <div>

        <h1 class="page-title">
          Products
        </h1>

        <div class="page-description">
          ${products.length} product${products.length === 1 ? '' : 's'}
        </div>

      </div>


      <button
        class="primary-button"
        onclick="openAddProductModal()"
      >
        + Add Product
      </button>

    </div>


    <div class="product-toolbar">

      <div class="product-search">

        <span class="search-icon">
          🔍
        </span>

        <input
          id="productSearch"
          class="search-box"
          type="text"
          placeholder="Search products..."
          autocomplete="off"
        >

      </div>


      <select
        id="productCategoryFilter"
        class="filter-select"
      >

        <option value="">
          All Categories
        </option>

        ${categories.map(function(value) {

          return `
            <option value="${escapeAttribute(value)}">
              ${escapeHtml(value)}
            </option>
          `;

        }).join('')}

      </select>


      <select
        id="productIndustryFilter"
        class="filter-select"
      >

        <option value="">
          All Industries
        </option>

        ${industries.map(function(value) {

          return `
            <option value="${escapeAttribute(value)}">
              ${escapeHtml(value)}
            </option>
          `;

        }).join('')}

      </select>


      <select
        id="productApplicationFilter"
        class="filter-select"
      >

        <option value="">
          All Applications
        </option>

        ${applications.map(function(value) {

          return `
            <option value="${escapeAttribute(value)}">
              ${escapeHtml(value)}
            </option>
          `;

        }).join('')}

      </select>

    </div>


    <div
      id="productResults"
      class="products-grid"
    ></div>

  `;


  window.productsData = products;


  renderProductCards(products);


  setupProductFilters();

}


/* =========================================================
   UNIQUE VALUES
========================================================= */

function getUniqueValues(data, field) {

  return [...new Set(

    data

      .map(function(item) {

        return String(item[field] || '').trim();

      })

      .filter(function(value) {

        return value !== '';

      })

  )].sort();

}


/* =========================================================
   PRODUCT FILTERS
========================================================= */

function setupProductFilters() {

  const search =
    document.getElementById('productSearch');

  const category =
    document.getElementById(
      'productCategoryFilter'
    );

  const industry =
    document.getElementById(
      'productIndustryFilter'
    );

  const application =
    document.getElementById(
      'productApplicationFilter'
    );


  function applyFilters() {

    const searchText =
      search.value.trim().toLowerCase();

    const categoryValue =
      category.value.toLowerCase();

    const industryValue =
      industry.value.toLowerCase();

    const applicationValue =
      application.value.toLowerCase();


    const filtered =
      window.productsData.filter(function(product) {

        const searchable =
          Object.values(product)
            .join(' ')
            .toLowerCase();


        const matchesSearch =
          !searchText ||
          searchable.includes(searchText);


        const matchesCategory =
          !categoryValue ||
          String(product['Category'] || '')
            .toLowerCase() === categoryValue;


        const matchesIndustry =
          !industryValue ||
          String(product['Industry'] || '')
            .toLowerCase() === industryValue;


        const matchesApplication =
          !applicationValue ||
          String(product['Application'] || '')
            .toLowerCase() === applicationValue;


        return (
          matchesSearch &&
          matchesCategory &&
          matchesIndustry &&
          matchesApplication
        );

      });


    renderProductCards(filtered);

  }


  search.addEventListener(
    'input',
    applyFilters
  );

  category.addEventListener(
    'change',
    applyFilters
  );

  industry.addEventListener(
    'change',
    applyFilters
  );

  application.addEventListener(
    'change',
    applyFilters
  );

}


/* =========================================================
   PRODUCT CARDS
========================================================= */

function renderProductCards(products) {

  const container =
    document.getElementById(
      'productResults'
    );


  if (!container) {
    return;
  }


  if (!products.length) {

    container.innerHTML = `

      <div class="empty-state product-empty">

        <div class="empty-icon">
          🔍
        </div>

        <div class="empty-title">
          No products found
        </div>

        <div>
          Try changing your search or filters.
        </div>

      </div>

    `;

    return;

  }


  container.innerHTML =
    products.map(function(product, index) {

      return createProductCard(
        product,
        index
      );

    }).join('');

}


/* =========================================================
   PRODUCT CARD
========================================================= */

function createProductCard(product, index) {

  const productId =
    product['Product ID'] || '';

  const productName =
    product['Product Name'] ||
    'Unnamed Product';

  const category =
    product['Category'] || '';

  const subCategory =
    product['Sub Category'] || '';

  const application =
    product['Application'] || '';

  const industry =
    product['Industry'] || '';

  const voltage =
    product['Voltage'] || '';

  const sizeRange =
    product['Size Range'] || '';

  const standard =
    product['Standard'] || '';

  const features =
    product['Key Features'] || '';


  return `

    <div class="product-card">

      <div class="product-card-top">

        <div class="product-icon">
          📦
        </div>

        <div class="product-status">
          ${escapeHtml(
            product['Status'] || 'Active'
          )}
        </div>

      </div>


      <div class="product-id">
        ${escapeHtml(productId)}
      </div>


      <div class="product-name">
        ${escapeHtml(productName)}
      </div>


      <div class="product-category">

        ${escapeHtml(category)}

        ${
          subCategory
            ? ' • ' + escapeHtml(subCategory)
            : ''
        }

      </div>


      <div class="product-info-list">

        ${
          industry
            ? `
              <div>
                <span>Industry</span>
                <b>${escapeHtml(industry)}</b>
              </div>
            `
            : ''
        }


        ${
          application
            ? `
              <div>
                <span>Application</span>
                <b>${escapeHtml(application)}</b>
              </div>
            `
            : ''
        }


        ${
          voltage
            ? `
              <div>
                <span>Voltage</span>
                <b>${escapeHtml(voltage)}</b>
              </div>
            `
            : ''
        }


        ${
          sizeRange
            ? `
              <div>
                <span>Size</span>
                <b>${escapeHtml(sizeRange)}</b>
              </div>
            `
            : ''
        }

      </div>


      ${
        features
          ? `
            <div class="product-features">

              ${escapeHtml(
                features
              )}

            </div>
          `
          : ''
      }


      <div class="product-card-footer">

        ${
          standard
            ? `
              <div class="product-standard">
                ${escapeHtml(standard)}
              </div>
            `
            : '<div></div>'
        }


        <button
          class="view-product-button"
          onclick="viewProduct('${escapeAttribute(productId)}')"
        >
          View Details →
        </button>

      </div>

    </div>

  `;

}


/* =========================================================
   VIEW PRODUCT
========================================================= */

function viewProduct(productId) {

  const product =
    window.productsData.find(function(item) {

      return String(
        item['Product ID'] || ''
      ) === String(productId);

    });


  if (!product) {

    alert('Product not found.');

    return;

  }


  openProductDetails(product);

}


/* =========================================================
   PRODUCT DETAILS
========================================================= */

function openProductDetails(product) {

  const old =
    document.getElementById(
      'productDetailsModal'
    );


  if (old) {
    old.remove();
  }


  const modal =
    document.createElement('div');


  modal.id =
    'productDetailsModal';

  modal.className =
    'modal-overlay';


  modal.innerHTML = `

    <div class="modal product-details-modal">

      <div class="modal-header">

  <div>

    <div class="modal-title">
      ${escapeHtml(
        product['Product Name'] ||
        'Product Details'
      )}
    </div>

    <div class="modal-subtitle">
      ${escapeHtml(
        product['Product ID'] || ''
      )}
    </div>

  </div>


  <div class="product-detail-actions">

    <button
      class="edit-product-button"
      onclick="editProduct('${escapeAttribute(
        product['Product ID'] || ''
      )}')"
    >
      ✏️ Edit
    </button>


    <button
      class="delete-product-button"
      onclick="confirmDeleteProduct('${escapeAttribute(
        product['Product ID'] || ''
      )}')"
    >
      🗑️ Delete
    </button>


    <button
      class="modal-close"
      onclick="closeProductDetails()"
    >
      ×
    </button>

  </div>

</div>


      <div class="product-details-body">

        ${createProductDetailSection(
          'Overview',
          [
            ['Category', product['Category']],
            ['Sub Category', product['Sub Category']],
            ['Application', product['Application']],
            ['Industry', product['Industry']],
            ['Customer Type', product['Customer Type']]
          ]
        )}


        ${createProductDetailSection(
          'Technical Information',
          [
            ['Voltage', product['Voltage']],
            ['Size Range', product['Size Range']],
            ['Standard', product['Standard']],
            ['Technical Notes', product['Technical Notes']]
          ]
        )}


        ${createProductDetailTextSection(
          'Key Features',
          product['Key Features']
        )}


        ${createProductDetailTextSection(
          'Sales Points',
          product['Sales Points']
        )}


        ${createProductDetailTextSection(
          'Product Advantage',
          product['Product Advantage']
        )}


        ${createProductDetailTextSection(
          'Competitors',
          product['Competitors']
        )}


        ${createProductDetailTextSection(
          'Documents & Links',
          [
            product['Datasheet']
              ? 'Datasheet: ' +
                product['Datasheet']
              : '',

            product['Catalogue']
              ? 'Catalogue: ' +
                product['Catalogue']
              : '',

            product['Image']
              ? 'Image: ' +
                product['Image']
              : ''
          ]
          .filter(Boolean)
          .join('\n')
        )}


        ${createProductDetailTextSection(
          'Status',
          product['Status']
        )}


        ${createProductDetailTextSection(
          'Last Updated',
          product['Last Updated']
        )}

      </div>

    </div>

  `;


  document.body.appendChild(modal);

}


/* =========================================================
   PRODUCT DETAIL SECTION
========================================================= */

function createProductDetailSection(
  title,
  fields
) {

  const validFields =
    fields.filter(function(field) {

      return String(
        field[1] || ''
      ).trim() !== '';

    });


  if (!validFields.length) {
    return '';
  }


  return `

    <div class="detail-section">

      <div class="detail-section-title">
        ${escapeHtml(title)}
      </div>


      <div class="detail-grid">

        ${validFields.map(function(field) {

          return `

            <div class="detail-item">

              <div class="detail-label">
                ${escapeHtml(field[0])}
              </div>

              <div class="detail-value">
                ${formatCell(field[1])}
              </div>

            </div>

          `;

        }).join('')}

      </div>

    </div>

  `;

}


/* =========================================================
   PRODUCT DETAIL TEXT
========================================================= */

function createProductDetailTextSection(
  title,
  value
) {

  if (
    value === null ||
    value === undefined ||
    String(value).trim() === ''
  ) {

    return '';

  }


  return `

    <div class="detail-section">

      <div class="detail-section-title">
        ${escapeHtml(title)}
      </div>

      <div class="detail-text">
        ${formatCell(value)}
      </div>

    </div>

  `;

}


/* =========================================================
   CLOSE PRODUCT DETAILS
========================================================= */

function closeProductDetails() {

  const modal =
    document.getElementById(
      'productDetailsModal'
    );


  if (modal) {
    modal.remove();
  }

}

/* =========================================================
   DATA TABLE
========================================================= */

function createDataTable(data) {

  if (!data || !data.length) {
    return '';
  }


  const headers =
    Object.keys(data[0]);


  let html = `

    <div class="table-container">

      <table class="data-table">

        <thead>

          <tr>

            ${headers.map(function (header) {

              return `

                <th>
                  ${escapeHtml(header)}
                </th>

              `;

            }).join('')}

          </tr>

        </thead>


        <tbody>

  `;


  data.forEach(function (record) {

    html += '<tr>';


    headers.forEach(function (header) {

      html += `

        <td>
          ${formatCell(record[header])}
        </td>

      `;

    });


    html += '</tr>';

  });


  html += `

        </tbody>

      </table>

    </div>

  `;


  return html;

}


/* =========================================================
   FORMAT CELL
========================================================= */

function formatCell(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  return escapeHtml(
    String(value)
  ).replace(/\n/g, '<br>');

}


/* =========================================================
   OPEN SECTION
========================================================= */

function openSection(section) {

  const buttons =
    document.querySelectorAll('.nav-item');


  buttons.forEach(function (button) {

    if (
      button.getAttribute('data-section') === section
    ) {

      setActiveNavigation(button);

    }

  });


  loadSection(section);

}


/* =========================================================
   QUICK SEARCH
========================================================= */

function quickSearch(text) {

  const cleanText =
    text
      .replace(/[^\w\s&-]/g, '')
      .trim();


  const search =
    document.getElementById('globalSearch');


  if (search) {

    search.value = cleanText;

    searchProducts(cleanText);

  }

}


/* =========================================================
   LOADING
========================================================= */

function showLoading() {

  const app =
    document.getElementById('app');


  app.innerHTML = `

    <div class="loading">
      Loading...
    </div>

  `;

}


/* =========================================================
   ERROR
========================================================= */

function showError(error) {

  const app =
    document.getElementById('app');


  const message =
    error && error.message
      ? error.message
      : String(error);


  app.innerHTML = `

    <div class="error-box">

      <div class="error-title">
        Something went wrong
      </div>

      <div>
        ${escapeHtml(message)}
      </div>

    </div>

  `;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  return String(value)

    .replace(/&/g, '&amp;')

    .replace(/</g, '&lt;')

    .replace(/>/g, '&gt;')

    .replace(/"/g, '&quot;')

    .replace(/'/g, '&#039;');

}


/* =========================================================
   ATTRIBUTE ESCAPE
========================================================= */

function escapeAttribute(value) {

  return escapeHtml(value)
    .replace(/`/g, '&#096;');

}

/* =========================================================
   ADD PRODUCT MODAL
========================================================= */

function openAddProductModal() {

  const existing =
    document.getElementById('productModal');

  if (existing) {
    existing.remove();
  }


  const modal = document.createElement('div');

  modal.id = 'productModal';

  modal.className = 'modal-overlay';


  modal.innerHTML = `

    <div class="modal">

      <div class="modal-header">

        <div>

          <div class="modal-title">
            Add Product
          </div>

          <div class="modal-subtitle">
            Add a new cable product to your Product Hub
          </div>

        </div>

        <button
          class="modal-close"
          onclick="closeAddProductModal()"
        >
          ×
        </button>

      </div>


      <form
        id="addProductForm"
        onsubmit="submitProduct(event)"
      >

        <div class="form-grid">


          <div class="form-group full">

            <label>
              Product Name *
            </label>

            <input
              type="text"
              name="productName"

/* =========================================================
   SUBMIT PRODUCT
========================================================= */

function submitProduct(event) {

  event.preventDefault();


  const form =
    document.getElementById('addProductForm');


  const button =
    document.getElementById('saveProductButton');


  const formData =
    new FormData(form);


  const product = {

    productName:
      formData.get('productName'),

    category:
      formData.get('category'),

    subCategory:
      formData.get('subCategory'),

    application:
      formData.get('application'),

    industry:
      formData.get('industry'),

    voltage:
      formData.get('voltage'),

    sizeRange:
      formData.get('sizeRange'),

    standard:
      formData.get('standard'),

    keyFeatures:
      formData.get('keyFeatures'),

    salesPoints:
      formData.get('salesPoints'),

    customerType:
      formData.get('customerType'),

    competitors:
      formData.get('competitors'),

    productAdvantage:
      formData.get('productAdvantage'),

    technicalNotes:
      formData.get('technicalNotes'),

    datasheet:
      formData.get('datasheet'),

    catalogue:
      formData.get('catalogue'),

    image:
      formData.get('image'),

    status:
      formData.get('status')

  };


  button.disabled = true;

  button.textContent = 'Saving...';


  google.script.run

    .withSuccessHandler(function (result) {

      closeAddProductModal();

      showSuccessMessage(
        'Product ' +
        result.productId +
        ' added successfully.'
      );


      loadSection('Products');

    })

    .withFailureHandler(function (error) {

      button.disabled = false;

      button.textContent = 'Save Product';

      alert(
        error.message ||
        'Unable to save product.'
      );

    })

    .addProduct(product);

}


/* =========================================================
   SUCCESS MESSAGE
========================================================= */

function showSuccessMessage(message) {

  const old =
    document.getElementById(
      'successMessage'
    );

  if (old) {
    old.remove();
  }


  const div =
    document.createElement('div');


  div.id = 'successMessage';

  div.className =
    'success-message';


  div.textContent =
    '✓ ' + message;


  document.body.appendChild(div);


  setTimeout(function () {

    div.classList.add('show');

  }, 20);


  setTimeout(function () {

    div.classList.remove('show');

    setTimeout(function () {

      div.remove();

    }, 300);

  }, 3000);

}

/* =========================================================

========================================================= */

function confirmDeleteProduct(productId) {

  const product =
    window.productsData.find(function(item) {

      return String(
        item['Product ID'] || ''
      ) === String(productId);

    });


  if (!product) {

    alert('Product not found.');

    return;

  }


  const productName =
    product['Product Name'] ||
    productId;


  const confirmed =
    confirm(
      'Delete this product?\n\n' +
      productName +
      '\n' +
      productId +
      '\n\n' +
      'This will permanently remove it from the Products sheet.'
    );


  if (!confirmed) {
    return;
  }


  deleteProduct(productId);

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

function deleteProduct(productId) {

  google.script.run

    .withSuccessHandler(function(result) {

      closeProductDetails();


      showSuccessMessage(
        'Product ' +
        result.productId +
        ' deleted successfully.'
      );


      loadSection('Products');

    })

    .withFailureHandler(function(error) {

      alert(
        error.message ||
        'Unable to delete product.'
      );

    })

    .deleteProduct(productId);

}


/* =========================================================
   SUBMIT PRODUCT EDIT
========================================================= */

function submitProductEdit(event) {

  event.preventDefault();


  const form =
    document.getElementById(
      'editProductForm'
    );


  const button =
    document.getElementById(
      'updateProductButton'
    );


  const productId =
    form.dataset.productId;


  /*
   * Product ID is stored from the modal subtitle
   * fallback is extracted from current product.
   */

  let currentProductId =
    productId;


  if (!currentProductId) {

    const products =
      window.productsData || [];


    const productName =
      form.productName.value;


    const found =
      products.find(function(item) {

        return String(
          item['Product Name'] || ''
        ) === String(productName);

      });


    if (found) {

      currentProductId =
        found['Product ID'];

    }

  }


  if (!currentProductId) {

    alert(
      'Product ID could not be determined.'
    );

    return;

  }


  const product = {

    productName:
      form.productName.value,

    category:
      form.category.value,

    subCategory:
      form.subCategory.value,

    application:
      form.application.value,

    industry:
      form.industry.value,

    voltage:
      form.voltage.value,

    sizeRange:
      form.sizeRange.value,

    standard:
      form.standard.value,

    keyFeatures:
      form.keyFeatures.value,

    salesPoints:
      form.salesPoints.value,

    customerType:
      form.customerType.value,

    competitors:
      form.competitors.value,

    productAdvantage:
      form.productAdvantage.value,

    technicalNotes:
      form.technicalNotes.value,

    datasheet:
      form.datasheet.value,

    catalogue:
      form.catalogue.value,

    image:
      form.image.value,

    status:
      form.status.value

  };


  button.disabled = true;

  button.textContent =
    'Saving...';


  google.script.run

    .withSuccessHandler(function(result) {

      closeAddProductModal();

      showSuccessMessage(
        'Product ' +
        result.productId +
        ' updated successfully.'
      );


      loadSection('Products');

    })

    .withFailureHandler(function(error) {

      button.disabled = false;

      button.textContent =
        'Save Changes';


      alert(
        error.message ||
        'Unable to update product.'
      );

    })

    .updateProduct(
      currentProductId,
      product
    );

}
